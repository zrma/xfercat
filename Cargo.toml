[package]
name = "xfercat"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Preview-first local and remote file transfer"
publish = false

[dependencies]
crossterm = "0.29.0"
futures-util = "0.3.33"
glob = "0.3.4"
openssh = "0.11.6"
openssh-sftp-client = { version = "0.15.7", features = ["openssh"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
